services:
  ecommerce-db:
    image: postgres:16
    container_name: ecommerce-db
    ports:
      - "5432:5432"
    volumes:
      - ecommerce-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  imagen-server:
    build: ./image-server
    container_name: ecommerce-imagen-server
    expose:
      - "80"
    ports:
      - "8090:80"
    volumes:
      - ecommerce-uploads:/usr/share/nginx/html/uploads
    networks:
      - ecommerce-network
    restart: unless-stopped

volumes:
  ecommerce-data:
  ecommerce-uploads:

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge