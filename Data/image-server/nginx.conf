server {
    listen 80;
    server_name localhost;

    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex off;

        # Cache para imágenes
        expires 7d;
        add_header Cache-Control "public, no-transform";

        # Solo permite lectura de archivos de imagen
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            try_files $uri =404;
        }
    }

    location / {
        return 404;
    }
}